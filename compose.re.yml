name: agentkvm2usb-re

x-runtime-defaults: &runtime-defaults
  init: true
  network_mode: none
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=512m

services:
  runner:
    <<: *runtime-defaults
    image: ${RE_RUNNER_IMAGE:-agentkvm2usb/re-runner:1}
    build:
      context: .
      dockerfile: containers/re-runner/Dockerfile
      args:
        # The official Python base is resolved to an immutable digest before the
        # build and passed as PYTHON_BASE_IMAGE=python@sha256:<digest>; the
        # human-readable tag is only the default seed.
        PYTHON_BASE_IMAGE: ${PYTHON_BASE_IMAGE:-python:3.12-slim-bookworm}
    working_dir: /work
    volumes:
      - ${RE_INPUT_ROOT:-./.work/re/input}:/work/input:ro
      - ${RE_OUTPUT_ROOT:-./.work/re/output}:/work/output:rw
      - ${RE_PROJECT_ROOT:-./.work/re/projects}:/work/projects:rw
      - ${RE_VENDOR_ROOT:-./.work/vendor}:/work/vendor:ro
      - ./scripts:/work/scripts:ro
      - ./tools/re:/work/tools:ro
    entrypoint: ["/bin/bash", "-lc"]
    command: ["python3 --version && tshark --version | head -n 1"]

  radare2:
    <<: *runtime-defaults
    image: ${RADARE2_IMAGE:-radare/radare2:6.1.8}
    working_dir: /work
    volumes:
      - ${RE_INPUT_ROOT:-./.work/re/input}:/work/input:ro
      - ${RE_OUTPUT_ROOT:-./.work/re/output}:/work/output:rw
      - ${RE_PROJECT_ROOT:-./.work/re/projects}:/work/projects:rw
    entrypoint: ["r2"]
    command: ["-v"]

  angr:
    <<: *runtime-defaults
    # The angr/angr publisher image is a bare dev base without angr installed,
    # so angr runs in the project runner image, which pins angr in its Python
    # requirements alongside the other analysis libraries.
    image: ${ANGR_IMAGE:-agentkvm2usb/re-runner:1}
    working_dir: /work
    volumes:
      - ${RE_INPUT_ROOT:-./.work/re/input}:/work/input:ro
      - ${RE_OUTPUT_ROOT:-./.work/re/output}:/work/output:rw
      - ${RE_PROJECT_ROOT:-./.work/re/projects}:/work/projects:rw
      - ./scripts:/work/scripts:ro
    entrypoint: ["python3"]
    command: ["-c", "import angr; print(angr.__version__)"]

  ghidra:
    <<: *runtime-defaults
    image: ${GHIDRA_IMAGE:-agentkvm2usb/ghidra:12.1.2-upstream}
    environment:
      MODE: headless
      # The upstream entrypoint reads MAXMEM. Ghidra writes ~/.config/ghidra
      # using Java's user.home (the passwd home /home/ghidra, not $HOME), so a
      # writable tmpfs overlays that path on the otherwise read-only root.
      MAXMEM: ${GHIDRA_HEADLESS_MAXMEM:-4G}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /home/ghidra/.config:rw,noexec,nosuid,size=64m
    volumes:
      - ${RE_INPUT_ROOT:-./.work/re/input}:/home/ghidra/input:ro
      - ${RE_OUTPUT_ROOT:-./.work/re/output}:/home/ghidra/output:rw
      - ${RE_PROJECT_ROOT:-./.work/re/projects}:/home/ghidra/projects:rw
      - ./scripts:/home/ghidra/scripts:ro
    command: []

  binwalk:
    <<: *runtime-defaults
    image: ${BINWALK_IMAGE:-agentkvm2usb/binwalk:3.1.0-upstream}
    working_dir: /analysis
    volumes:
      - ${RE_INPUT_ROOT:-./.work/re/input}:/analysis/input:ro
      - ${RE_OUTPUT_ROOT:-./.work/re/output}:/analysis/output:rw
    entrypoint: ["binwalk"]
    command: ["--help"]

  syft:
    <<: *runtime-defaults
    image: ${SYFT_IMAGE:-anchore/syft:v1.19.0}
    volumes:
      - ${RE_INPUT_ROOT:-./.work/re/input}:/input:ro
      - ${RE_OUTPUT_ROOT:-./.work/re/output}:/output:rw
      - ${RE_CACHE_ROOT:-./.work/re/cache}/scan-tmp:/tmp:rw
      - ${RE_CACHE_ROOT:-./.work/re/cache}/syft:/.cache:rw
    # The syft image's binary lives at /syft, not on PATH. The docker-archive
    # scan extracts image layers, so /tmp and /.cache are host-backed writable
    # dirs instead of the 512 MiB default tmpfs.
    tmpfs: []
    entrypoint: ["/syft"]
    command: ["version"]

  trivy:
    <<: *runtime-defaults
    image: ${TRIVY_IMAGE:-aquasec/trivy:0.57.1}
    volumes:
      - ${RE_INPUT_ROOT:-./.work/re/input}:/input:ro
      - ${RE_CACHE_ROOT:-./.work/re/cache}/trivy:/root/.cache/trivy:rw
      - ${RE_CACHE_ROOT:-./.work/re/cache}/scan-tmp:/tmp:rw
      - ${RE_OUTPUT_ROOT:-./.work/re/output}:/output:rw
    tmpfs: []
    entrypoint: ["trivy"]
    command: ["--version"]
