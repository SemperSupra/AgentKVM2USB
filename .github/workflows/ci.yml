name: CI

on:
  pull_request:
    branches:
      - main
      - recovery/agentkvm2usb-app-capabilities
  push:
    branches:
      - main
      - recovery/agentkvm2usb-app-capabilities
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-python:
    name: Windows / Python 3.12
    runs-on: windows-2025
    timeout-minutes: 20

    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --requirement requirements.txt

      - name: Compile Python sources
        shell: pwsh
        run: python -m compileall -q .

      - name: Run test suite
        shell: pwsh
        run: python -m pytest -q

      - name: Verify reproducible portable build
        shell: pwsh
        run: |
          $FirstRoot = Join-Path $PWD ".work\ci-build-one"
          $SecondRoot = Join-Path $PWD ".work\ci-build-two"

          python .\scripts\build_portable.py --version ci --dist-dir $FirstRoot
          if ($LASTEXITCODE -ne 0) { throw "First portable build failed." }

          python .\scripts\build_portable.py --version ci --dist-dir $SecondRoot
          if ($LASTEXITCODE -ne 0) { throw "Second portable build failed." }

          $Archive = "AgentKVM2USB-vci-windows-portable.zip"
          $FirstHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $FirstRoot $Archive)).Hash
          $SecondHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $SecondRoot $Archive)).Hash

          if ($FirstHash -ne $SecondHash) {
            throw "Portable build is not reproducible: $FirstHash != $SecondHash"
          }

          Write-Host "Reproducible portable archive SHA256: $FirstHash"
